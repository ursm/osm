on: push

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cargo
        with:
          command: run
          args: -- --help

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cargo
        with:
          command: test

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cargo
        with:
          components: rustfmt
          command: fmt
          args: --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cargo
        with:
          components: clippy
          command: clippy

  readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cargo
        with:
          command: install
          args: --git https://github.com/ursm/handlematters

      - run: make README.md

      - run: git diff --exit-code README.md
